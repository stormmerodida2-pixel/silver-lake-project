<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Runs synchronously before the stylesheet paints, so the correct theme class is on
         <html> from the first frame - avoiding a flash of the wrong theme on load. Mirrors
         stores/theme.js's own storage key/fallback; that store re-applies the same class
         once Pinia boots so both stay driven by one source of truth afterward. -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('sl_theme') || 'dark'
          document.documentElement.classList.add(theme)
          document.documentElement.style.colorScheme = theme
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Installable PWA - a service worker is already registered unconditionally on every page
         load (src/utils/pushNotifications.js, for Web Push), which alongside this manifest is
         everything Chrome/Android need to offer "Add to Home Screen". iOS Safari doesn't read
         the manifest for its own home-screen icon, hence the separate apple-touch-icon/
         apple-mobile-web-app-* tags below. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0a1730" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SilverLake" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>SilverLake Car Rentals | Car Hire in Kisumu &amp; Across Kenya</title>
    <meta
      name="description"
      content="SilverLake Car Rentals - premium car hire in Kisumu with drivers or self-drive. Prado, Voxy, Axio and vans available. Book instantly via WhatsApp or M-Pesa."
    />
    <meta name="keywords" content="car hire Kisumu, car rental Kenya, self drive Kisumu, Prado hire Kisumu, van hire Kisumu" />
    <meta name="robots" content="index, follow" />
    <!-- Per-route canonical - utils/seo.js's setPageMeta() rewrites this on every navigation
         (see its updateCanonical()) so /fleet, /blog/some-post etc. each declare themselves
         canonical instead of every page pointing back at the homepage. This is just the
         first-load default, same reasoning as the static OG tags below. -->
    <link rel="canonical" href="https://silverlakecarentals.com/" />
    <!-- Static, not just utils/seo.js's dynamic setPageMeta() - social crawlers (Facebook,
         WhatsApp, Twitter/X, LinkedIn) fetch raw HTML and don't execute JS, so a tag only added
         after Vue mounts is invisible to them. This is the real fallback every link preview
         actually sees; setPageMeta() only overrides it for a page already open in a browser
         (e.g. a blog post using its own cover image). -->
    <meta property="og:site_name" content="SilverLake Car Rentals" />
    <meta property="og:title" content="SilverLake Car Rentals | Car Hire in Kisumu &amp; Across Kenya" />
    <meta
      property="og:description"
      content="SilverLake Car Rentals - premium car hire in Kisumu with drivers or self-drive. Prado, Voxy, Axio and vans available. Book instantly via WhatsApp or M-Pesa."
    />
    <!-- Absolute URLs, not relative - most link-preview crawlers (WhatsApp, Facebook, Slack,
         LinkedIn) resolve og:image/og:url against whatever they think the page's own URL is,
         which isn't reliable across a redirect chain (http->https, apex<->www) - a relative path
         here has silently failed to show an image on some of them. -->
    <meta property="og:url" content="https://silverlakecarentals.com/" />
    <!-- JPEG at ~70KB, not the original 1.06MB PNG - WhatsApp in particular is known to silently
         drop the image (not just show a blank preview, drop it entirely) when the fetch is slow
         or the file is large; several platforms also cache a bad scrape from before this file
         existed, so a stale/missing preview afterward doesn't necessarily mean this tag is wrong. -->
    <meta property="og:image" content="https://silverlakecarentals.com/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="657" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SilverLake Car Rentals | Car Hire in Kisumu &amp; Across Kenya" />
    <meta
      name="twitter:description"
      content="SilverLake Car Rentals - premium car hire in Kisumu with drivers or self-drive. Prado, Voxy, Axio and vans available. Book instantly via WhatsApp or M-Pesa."
    />
    <meta name="twitter:image" content="https://silverlakecarentals.com/og-image.jpg" />
    <!-- LocalBusiness structured data - lets Google associate this exact page with the
         "SilverLake Car Rentals" brand/entity directly (name, phone, city), which is what a
         branded search actually needs beyond just being indexed. AutoRental is schema.org's
         more specific LocalBusiness subtype for a car rental company.

         id="ld-local-business" + the "@id" inside the JSON below give this specific entity a
         stable identity that utils/seo.js's dynamic setStructuredData() blocks (e.g. HomeView's
         AggregateRating) can reference via the same "@id", so they describe additional facts
         about *this* organization rather than a second, disconnected one. Static, not touched
         by JS - see utils/seo.js's own "ld-dynamic-" prefix convention for what IS touched. -->
    <script type="application/ld+json" id="ld-local-business">
      {
        "@context": "https://schema.org",
        "@type": "AutoRental",
        "@id": "https://silverlakecarentals.com/#organization",
        "name": "SilverLake Car Rentals",
        "url": "https://silverlakecarentals.com/",
        "image": "https://silverlakecarentals.com/og-image.jpg",
        "telephone": "+254798184193",
        "priceRange": "KES",
        "description": "Premium car hire in Kisumu with drivers or self-drive. Prado, Voxy, Axio and vans available. Book instantly via WhatsApp or M-Pesa.",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Kisumu",
          "addressCountry": "KE"
        },
        "areaServed": {
          "@type": "Country",
          "name": "Kenya"
        }
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
